<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Two GIFs, fullscreen. Press 1 or 2 to switch.">
  <title>GIFs</title>
  <link rel="preload" as="image" href="assets/first.gif">
  <link rel="preload" as="image" href="assets/second.gif">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #viewer { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
    .gif { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: fill; }
  </style>
</head>
<body>
  <main id="viewer" aria-label="Fullscreen GIF viewer">
    <img id="gif" class="gif" src="assets/first.gif" alt="First dancing emoji GIF" draggable="false" fetchpriority="high">
  </main>
  <script>
    const gif = document.getElementById('gif');
    let current = 1;
    let pendingFullscreen = false;

    async function enterFullscreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement || pendingFullscreen) return;
      const page = document.documentElement;
      const request = page.requestFullscreen || page.webkitRequestFullscreen;
      if (!request) return;
      pendingFullscreen = true;
      try {
        await request.call(page);
      } catch {
        // Browsers may require a user gesture; retry on the next click or keypress.
      } finally {
        pendingFullscreen = false;
      }
    }

    function showGif(number) {
      if (number === current) return;
      current = number;
      gif.src = number === 1 ? 'assets/first.gif' : 'assets/second.gif';
      gif.alt = number === 1 ? 'First dancing emoji GIF' : 'Second dancing emoji GIF';
    }

    document.addEventListener('click', enterFullscreen);
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.altKey || event.metaKey || event.repeat) return;
      if (event.key === '1' || event.code === 'Numpad1') {
        event.preventDefault();
        showGif(1);
      } else if (event.key === '2' || event.code === 'Numpad2') {
        event.preventDefault();
        showGif(2);
      }
      if (event.key !== 'Escape' && event.key !== 'F11') enterFullscreen();
    });
    enterFullscreen();
  </script>
</body>
</html>
