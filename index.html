<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Two GIFs, fullscreen. Press 1 or 2 to switch.">
  <title>GIFs</title>
  <link rel="preload" as="image" href="assets/first.gif">
  <link rel="preload" as="image" href="assets/second.gif">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #viewer { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
    .gif { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: fill; }
    .gif[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="viewer" aria-label="Fullscreen GIF viewer">
    <img id="first" class="gif" src="assets/first.gif" alt="First dancing emoji GIF" draggable="false" fetchpriority="high">
    <img id="second" class="gif" src="assets/second.gif" alt="Second dancing emoji GIF" draggable="false" hidden>
  </main>
  <script>
    const viewer = document.getElementById('viewer');
    const first = document.getElementById('first');
    const second = document.getElementById('second');
    let pendingFullscreen = false;

    function showGif(number) {
      first.hidden = number !== 1;
      second.hidden = number !== 2;
    }

    async function enterFullscreen() {
      if (document.fullscreenElement || document.webkitFullscreenElement || pendingFullscreen) return;
      const request = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
      if (!request) return;
      pendingFullscreen = true;
      try {
        await request.call(viewer);
      } catch {
        // A later user interaction can retry if the browser rejects the request.
      } finally {
        pendingFullscreen = false;
      }
    }

    viewer.addEventListener('click', enterFullscreen);
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.altKey || event.metaKey || event.repeat) return;
      if (event.key === '1' || event.code === 'Numpad1') {
        event.preventDefault();
        showGif(1);
        enterFullscreen();
      } else if (event.key === '2' || event.code === 'Numpad2') {
        event.preventDefault();
        showGif(2);
        enterFullscreen();
      } else if (event.key === 'Enter' || event.key === ' ' || event.key.toLowerCase() === 'f') {
        event.preventDefault();
        enterFullscreen();
      }
    });
  </script>
</body>
</html>
